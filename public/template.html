<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__DEVICE__ __TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --fg:#1b2230; --muted:#5d6778; --line:#d7dce4; --soft:#eceff4;
  --por:#b3261e; --por-bg:#fbe9e7; --chip:#b85c00; --chip-bg:#fdf0e1;
  --sys:#1f5fbf; --sys-bg:#e7effb; --ss:#1d7a4a; --ss-bg:#e5f4ec; --per:#5b5f97; --per-bg:#ecedf7;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11151c; --panel:#181d26; --fg:#e4e8ef; --muted:#9aa4b5; --line:#2c3443; --soft:#202734;
  --por:#ff8a80; --por-bg:#3a1d1b; --chip:#ffb366; --chip-bg:#3a2a17; --sys:#7fb0ff; --sys-bg:#1a2a44;
  --ss:#6fd3a0; --ss-bg:#173327; --per:#adb1f0; --per-bg:#25264a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 56px;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2.1rem;line-height:1.1} h2{font-size:1.45rem} h3{font-size:1.05rem}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.86em}
.lede{color:var(--muted);max-width:70ch;margin-top:8px}
header .meta{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-top:10px}
section{display:flex;flex-direction:column;gap:12px}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
.gotchas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:.86rem}
.g b{display:block;margin-bottom:3px}
.s{border:1px solid var(--line);border-left:3px solid var(--sys);border-radius:4px;padding:5px 9px;font-size:.85rem;background:var(--panel)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-family:var(--f-mono);font-size:.76rem;font-weight:600;border:1px solid currentColor}
.p-por{color:var(--por);background:var(--por-bg)} .p-chip{color:var(--chip);background:var(--chip-bg)}
.p-sys{color:var(--sys);background:var(--sys-bg)} .p-ss{color:var(--ss);background:var(--ss-bg)} .p-per{color:var(--per);background:var(--per-bg)}
.note{font-size:.82rem;color:var(--muted);max-width:80ch}
@media (max-width:860px){.gotchas{grid-template-columns:1fr}}
</style></head>
<body>
<div class="wrap">
<header>
  <h1>__DEVICE__ __TITLE__</h1>
  <p class="lede">One-line summary of this topic.</p>
  <p class="meta">Sources: TRM §x.y · DS §x.y</p>
</header>

<section>
<h2>Overview</h2>
<p>Start writing…</p>
<ul><li>Point one</li><li>Point two</li></ul>
</section>

<section>
<h2>Gotchas</h2>
<div class="gotchas">
  <div class="g"><b>Watch out</b>Something easy to get wrong.</div>
  <div class="g"><b>Remember</b>Something worth remembering.</div>
</div>
</section>
</div>
</body></html>
