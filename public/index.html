<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDVault</title>
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1e1e1e">
<link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="/vendor/codemirror/addon/hint/show-hint.css">
<link rel="stylesheet" href="/vendor/codemirror/addon/dialog/dialog.css">
<link rel="stylesheet" href="/vendor/katex/katex.min.css"><!-- also needed here: @font-face inside shadow roots is ignored -->
<link rel="stylesheet" href="/css/app.css">
<script>
  // apply theme before first paint
  try { const s = JSON.parse(localStorage.getItem('mdvault.settings') || '{}'); document.documentElement.dataset.theme = s.theme || 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>
<div id="app">
  <nav class="ribbon">
    <div class="ribbon-top">
      <button class="ribbon-btn" data-cmd="toggle-left" title="Toggle left sidebar"><i data-lucide="panel-left"></i></button>
      <button class="ribbon-btn" data-cmd="quick-switcher" title="Open quick switcher (Ctrl+O)"><i data-lucide="file-search"></i></button>
      <button class="ribbon-btn" data-cmd="graph" title="Open graph view (Ctrl+G)"><i data-lucide="git-fork"></i></button>
      <button class="ribbon-btn" data-cmd="daily-note" title="Open today's daily note"><i data-lucide="calendar-days"></i></button>
      <button class="ribbon-btn" data-cmd="palette" title="Open command palette (Ctrl+P)"><i data-lucide="terminal"></i></button>
      <button class="ribbon-btn" data-cmd="new-note" title="New note (Alt+N)"><i data-lucide="square-pen"></i></button>
    </div>
    <div class="ribbon-bottom">
      <button class="ribbon-btn" data-cmd="sync" title="Sync with GitHub"><i data-lucide="refresh-cw"></i></button>
      <button class="ribbon-btn" data-cmd="toggle-theme" title="Toggle light/dark"><i data-lucide="sun-moon"></i></button>
      <button class="ribbon-btn" data-cmd="settings" title="Settings (Ctrl+,)"><i data-lucide="settings"></i></button>
    </div>
  </nav>

  <aside class="sidebar sidebar-left" id="left">
    <div class="sidebar-tabs">
      <button class="side-tab is-active" data-pane="files" title="Files"><i data-lucide="folder-closed"></i></button>
      <button class="side-tab" data-pane="search" title="Search (Ctrl+Shift+F)"><i data-lucide="search"></i></button>
      <button class="side-tab" data-pane="tags" title="Tags"><i data-lucide="tags"></i></button>
      <button class="side-tab" data-pane="bookmarks" title="Bookmarks"><i data-lucide="bookmark"></i></button>
    </div>
    <div class="pane is-active" data-pane="files">
      <div class="nav-header">
        <button class="icon-btn" data-cmd="new-note" title="New note"><i data-lucide="square-pen"></i></button>
        <button class="icon-btn" data-cmd="new-folder" title="New folder"><i data-lucide="folder-plus"></i></button>
        <button class="icon-btn" id="sort-btn" title="Change sort order"><i data-lucide="arrow-up-narrow-wide"></i></button>
        <button class="icon-btn" data-cmd="collapse-all" title="Collapse all"><i data-lucide="chevrons-down-up"></i></button>
      </div>
      <div class="file-tree" id="file-tree" tabindex="0"></div>
      <div class="vault-name" id="vault-name"></div>
    </div>
    <div class="pane" data-pane="search">
      <div class="search-box">
        <i data-lucide="search"></i>
        <input id="search-input" type="search" placeholder="Search…  (tag:#x  path:dir  file:name)" spellcheck="false">
      </div>
      <div class="search-meta" id="search-meta"></div>
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="pane" data-pane="tags"><div id="tag-list" class="tag-list"></div></div>
    <div class="pane" data-pane="bookmarks"><div id="bookmark-list" class="bookmark-list"></div></div>
  </aside>
  <div class="resizer" data-for="left"></div>

  <main class="workspace">
    <div class="tab-bar">
      <div class="tabs" id="tabs"></div>
      <button class="icon-btn new-tab" data-cmd="new-tab" title="New tab (Alt+T)"><i data-lucide="plus"></i></button>
      <div class="tab-bar-spacer"></div>
      <button class="icon-btn" data-cmd="toggle-right" title="Toggle right sidebar"><i data-lucide="panel-right"></i></button>
    </div>
    <div class="view-header" id="view-header">
      <div class="view-nav">
        <button class="icon-btn" data-cmd="back" title="Navigate back (Alt+←)"><i data-lucide="arrow-left"></i></button>
        <button class="icon-btn" data-cmd="forward" title="Navigate forward (Alt+→)"><i data-lucide="arrow-right"></i></button>
      </div>
      <div class="view-title" id="view-title"></div>
      <div class="view-actions">
        <button class="icon-btn" id="bookmark-btn" data-cmd="bookmark" title="Bookmark"><i data-lucide="bookmark"></i></button>
        <button class="icon-btn" id="split-btn" data-cmd="toggle-split" title="Split: editor + preview"><i data-lucide="columns-2"></i></button>
        <button class="icon-btn" id="mode-btn" data-cmd="toggle-mode" title="Toggle reading view (Ctrl+E)"><i data-lucide="book-open"></i></button>
        <button class="icon-btn" id="more-btn" title="More options"><i data-lucide="more-vertical"></i></button>
      </div>
    </div>
    <div class="view-content" id="view-content">
      <div class="empty-state" id="empty-state">
        <img src="/icon.svg" alt="" width="72" height="72" style="margin-bottom:6px;filter:drop-shadow(0 6px 18px rgba(16,185,129,.35))">
        <div class="empty-title">No file is open</div>
        <button class="link-btn" data-cmd="new-note">Create new note (Alt+N)</button>
        <button class="link-btn" data-cmd="quick-switcher">Go to file (Ctrl+O)</button>
        <button class="link-btn" data-cmd="graph">Open graph view (Ctrl+G)</button>
        <button class="link-btn" data-cmd="close-tab">Close</button>
      </div>
      <div class="note-view" id="note-view">
        <div class="pane-source" id="pane-source">
          <div class="scroller" id="source-scroller">
            <div class="readable"><input class="inline-title" id="inline-title-src" spellcheck="false"></div>
            <div id="editor-host"></div>
          </div>
        </div>
        <div class="pane-preview" id="pane-preview">
          <div class="scroller" id="preview-scroller">
            <div class="readable"><input class="inline-title" id="inline-title-prev" spellcheck="false"></div>
            <div class="preview-host" id="preview-host"></div>
          </div>
        </div>
      </div>
      <div class="graph-view" id="graph-view">
        <canvas id="graph-canvas"></canvas>
        <div class="graph-controls" id="graph-controls">
          <input type="search" id="graph-filter" placeholder="Filter files…">
          <label><input type="checkbox" id="graph-tags"> Tags</label>
          <label><input type="checkbox" id="graph-orphans" checked> Orphans</label>
          <label><input type="checkbox" id="graph-attach"> Attachments</label>
        </div>
      </div>
    </div>
    <div class="status-bar" id="status-bar">
      <span id="st-backlinks"></span>
      <span id="st-words"></span>
      <span id="st-save"></span>
      <button id="st-sync" class="st-sync" title="Sync with GitHub"><i data-lucide="cloud"></i><span></span></button>
    </div>
  </main>

  <div class="resizer" data-for="right"></div>
  <aside class="sidebar sidebar-right" id="right">
    <div class="sidebar-tabs">
      <button class="side-tab is-active" data-pane="backlinks" title="Backlinks"><i data-lucide="link"></i></button>
      <button class="side-tab" data-pane="outgoing" title="Outgoing links"><i data-lucide="external-link"></i></button>
      <button class="side-tab" data-pane="outline" title="Outline"><i data-lucide="list"></i></button>
      <button class="side-tab" data-pane="localgraph" title="Local graph"><i data-lucide="waypoints"></i></button>
      <button class="side-tab" data-pane="properties" title="Properties &amp; history"><i data-lucide="info"></i></button>
    </div>
    <div class="pane is-active" data-pane="backlinks"><div id="backlinks"></div></div>
    <div class="pane" data-pane="outgoing"><div id="outgoing"></div></div>
    <div class="pane" data-pane="outline"><div id="outline"></div></div>
    <div class="pane pane-graph" data-pane="localgraph"><canvas id="local-graph-canvas"></canvas></div>
    <div class="pane" data-pane="properties"><div id="file-info"></div></div>
  </aside>
</div>

<div id="modal-root"></div>
<div id="notices"></div>
<div id="hover-popover" class="hover-popover"></div>

<!-- vendored libraries (served from node_modules — works offline) -->
<script src="/vendor/codemirror/lib/codemirror.js"></script>
<script src="/vendor/codemirror/addon/mode/overlay.js"></script>
<script src="/vendor/codemirror/mode/xml/xml.js"></script>
<script src="/vendor/codemirror/mode/markdown/markdown.js"></script>
<script src="/vendor/codemirror/mode/gfm/gfm.js"></script>
<script src="/vendor/codemirror/mode/yaml/yaml.js"></script>
<script src="/vendor/codemirror/mode/css/css.js"></script>
<script src="/vendor/codemirror/mode/javascript/javascript.js"></script>
<script src="/vendor/codemirror/mode/htmlmixed/htmlmixed.js"></script>
<script src="/vendor/codemirror/mode/yaml-frontmatter/yaml-frontmatter.js"></script>
<script src="/vendor/codemirror/addon/edit/continuelist.js"></script>
<script src="/vendor/codemirror/addon/edit/closebrackets.js"></script>
<script src="/vendor/codemirror/addon/hint/show-hint.js"></script>
<script src="/vendor/codemirror/addon/dialog/dialog.js"></script>
<script src="/vendor/codemirror/addon/search/searchcursor.js"></script>
<script src="/vendor/codemirror/addon/search/search.js"></script>
<script src="/vendor/codemirror/addon/selection/active-line.js"></script>
<script src="/vendor/markdown-it/markdown-it.min.js"></script>
<script src="/vendor/footnote/markdown-it-footnote.min.js"></script>
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/hljs/highlight.min.js"></script>
<script src="/vendor/js-yaml/js-yaml.min.js"></script>
<script src="/vendor/lucide/lucide.min.js"></script>
<script src="/vendor/mermaid/mermaid.min.js" defer></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
